<div class="page-header">
  <div>
    <a routerLink="/clients" class="back-link"><i class="bi bi-arrow-left"></i> Retour aux clients</a>
    <h1 class="page-title">{{ isEditMode() ? 'Modifier le client' : 'Nouveau client' }}</h1>
  </div>
</div>

@if (isLoading()) {
  <div class="text-center py-5 text-muted">
    <div class="spinner-border text-primary mb-2"></div>
    <div>Chargement du client...</div>
  </div>
} @else {
  <div class="card form-card">
    <div class="card-body p-4">
      <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="row g-3">

          <div class="col-md-6">
            <label for="lastName" class="form-label">Nom <span class="text-danger">*</span></label>
            <input id="lastName" class="form-control" formControlName="lastName"
                   [class.is-invalid]="fieldError('lastName')" />
            <div class="invalid-feedback">{{ fieldError('lastName') }}</div>
          </div>

          <div class="col-md-6">
            <label for="firstNameOrCompany" class="form-label">Prénom ou raison sociale <span class="text-danger">*</span></label>
            <input id="firstNameOrCompany" class="form-control" formControlName="firstNameOrCompany"
                   [class.is-invalid]="fieldError('firstNameOrCompany')" />
            <div class="invalid-feedback">{{ fieldError('firstNameOrCompany') }}</div>
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input id="email" type="email" class="form-control" formControlName="email"
                     [class.is-invalid]="fieldError('email')" />
              <div class="invalid-feedback">{{ fieldError('email') }}</div>
            </div>
          </div>

          <div class="col-md-6">
            <label for="phone" class="form-label">Téléphone</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-telephone"></i></span>
              <input id="phone" type="tel" class="form-control" formControlName="phone"
                     placeholder="+216 98 123 456" [class.is-invalid]="fieldError('phone')" />
              <div class="invalid-feedback">{{ fieldError('phone') }}</div>
            </div>
          </div>

          <div class="col-12">
            <label for="address" class="form-label">Adresse</label>
            <textarea id="address" rows="2" class="form-control" formControlName="address"
                      [class.is-invalid]="fieldError('address')"></textarea>
            <div class="invalid-feedback">{{ fieldError('address') }}</div>
          </div>

        </div>

        <div class="form-actions">
          <a routerLink="/clients" class="btn btn-light">Annuler</a>
          <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
            @if (isSaving()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            {{ isEditMode() ? 'Enregistrer les modifications' : 'Créer le client' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
